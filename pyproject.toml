[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-ai-project-2026-10-25-policygraph-agent-iac-security-remediation"
version = "0.1.0"
description = "Starter scaffold for PolicyGraph-Agent: Multi-Agent Autonomous IaC Security Remediation Engine with LangGraph Verification Cycles"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
